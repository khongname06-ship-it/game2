<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đua vịt trắc nghiệm</title>
<style>
:root{--ink:#16324f;--acc:#ff8a00;--ok:#2e9e5b;--bad:#d64045}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#e9f6ff;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{margin:0 0 12px;font-size:1.5rem}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0001;margin-bottom:16px}
.track{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(#7fd0ff,#2aa3e8);padding:8px 0}
.lane{position:relative;height:56px;border-bottom:2px dashed #ffffff66}
.lane:last-child{border-bottom:0}
.duck{position:absolute;top:0;left:2%;display:flex;align-items:center;gap:6px;transition:left .9s cubic-bezier(.3,.9,.3,1);z-index:2;white-space:nowrap}
.duck .em{font-size:2.2rem;display:inline-block;transform:scaleX(-1);animation:bob 1.2s ease-in-out infinite}
.duck .tag{background:#fff;border-radius:999px;padding:1px 10px;font-size:.85rem;font-weight:700}
.duck.me .tag{background:var(--acc);color:#fff}
@keyframes bob{50%{transform:scaleX(-1) translateY(-5px) rotate(4deg)}}
.rank{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:#fff;border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem}
input[type=text]{width:100%;padding:12px;font-size:1rem;border:2px solid #cfe3f3;border-radius:10px;margin:10px 0}
.btn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.meta{display:flex;justify-content:space-between;color:#4a6a86;font-size:.9rem}
.bar{height:6px;background:#dbe9f5;border-radius:3px;margin:8px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transform-origin:left}
.q{font-size:1.2rem;font-weight:700;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;padding:12px;margin-bottom:8px;border:2px solid #cfe3f3;border-radius:12px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#e3f6ea}
.opt.bad{border-color:var(--bad);background:#fbe5e6}
.power{margin-top:12px;padding:12px;border-radius:12px;background:#fff6e0;border:2px solid var(--acc)}
.power button{margin:6px 6px 0 0;padding:8px 12px;border:0;border-radius:999px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.power button.skip{background:#9bb0c4}
.status-me{font-size:.9rem;font-weight:600;color:#b45f00;min-height:22px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--bad);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:9;box-shadow:0 4px 14px #0004}
.hide{display:none}
.note{color:#4a6a86;font-size:.85rem}
body.host .gamecard{display:none}
body.host h1{font-size:2.2rem}
body.host .duck .em{font-size:3rem}
body.host .duck .tag{font-size:1.1rem}
body.host .lane{height:76px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🦆 Đua vịt trắc nghiệm</h1>
  <div class="card" style="padding:0"><div class="track" id="lanes"></div></div>
  <div class="rank" id="rank"></div>
  <p class="note" id="status"></p>

  <div class="card gamecard" style="margin-top:16px">
    <div id="s-join">
      <label for="name"><b>Tên của bạn</b></label>
      <input type="text" id="name" maxlength="16" placeholder="Ví dụ: Minh Anh" autocomplete="off">
      <button class="btn" id="go">Xuống nước!</button>
      <p class="note">Trả lời đúng để vịt bơi lên đầu. Có thể nhận vật phẩm may mắn: ⚡ Nhân đôi điểm, 🏴‍☠️ Cướp 10% điểm của người khác, 🛡️ Khiên chống bị cướp.</p>
    </div>
    <div id="s-play" class="hide">
      <div class="meta"><span id="prog"></span><span id="score"></span></div>
      <div class="status-me" id="mystatus"></div>
      <div class="bar"><i id="timer"></i></div>
      <p class="q" id="qtext"></p>
      <div id="opts"></div>
      <b id="fb"></b>
      <div class="power hide" id="power"></div>
    </div>
    <div id="s-end" class="hide"><h2 id="final"></h2><p>Bạn đã hoàn thành! Xem các bạn khác đang đua trên đường bơi nhé. Điểm của bạn vẫn có thể bị cướp đó 😄</p></div>
  </div>
</div>
<div class="toast hide" id="toast"></div>

<script type="module">
import { firebaseConfig, ROOM } from "./config.js";
import { QUESTIONS, SECONDS_PER_QUESTION as PER_Q, POWERUP_CHANCE, STEAL_PERCENT } from "./questions.js";

const $ = id => document.getElementById(id);
const HOST = new URLSearchParams(location.search).has("host");
if (HOST) document.body.classList.add("host");

const DEMO = firebaseConfig.apiKey === "YOUR_API_KEY";
const myId = localStorage.getItem("duckId") || ("p" + Math.random().toString(36).slice(2, 10));
localStorage.setItem("duckId", myId);

let players = {};
let myName = "", boost = false;
let join = async () => {};
let update = async () => {};   // update(id, fn): fn sửa trực tiếp object người chơi (an toàn khi nhiều người cùng ghi)

/* ---------- Kết nối dữ liệu ---------- */
if (DEMO) {
  $("status").textContent = "Chế độ DEMO: vịt máy tự bơi. Cấu hình Firebase trong config.js để chơi nhiều người.";
  ["Vịt Bầu", "Vịt Cỏ", "Vịt Xiêm", "Vịt Trời"].forEach((n, i) => players["bot" + i] = { name: n, score: 0, at: i, shield: false });
  update = async (id, fn) => { if (!players[id]) return; const c = { ...players[id] }; fn(c); players[id] = c; render(); };
  setInterval(() => update("bot" + Math.floor(Math.random() * 4), p => { p.score += 100 + Math.floor(Math.random() * 50); }), 1800);
  join = async () => { players[myId] = { name: myName, score: 0, at: Date.now(), shield: false }; render(); };
} else {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getDatabase, ref, set, onValue, runTransaction } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const db = getDatabase(initializeApp(firebaseConfig));
  const node = id => ref(db, `rooms/${ROOM}/players/${id}`);
  onValue(ref(db, `rooms/${ROOM}/players`), s => { players = s.val() || {}; render(); });
  join = () => set(node(myId), { name: myName, score: 0, at: Date.now(), shield: false });
  update = (id, fn) => runTransaction(node(id), p => { if (!p) return p; const c = { ...p }; fn(c); return c; });
}

/* ---------- Đường đua: không có đích, ai dẫn đầu thì ở xa nhất ---------- */
const laneEls = {};
let seenHit = 0;
function render() {
  const ids = Object.keys(players);
  const scores = ids.map(id => players[id].score || 0);
  const top = Math.max(1, ...scores);
  const order = ids.slice().sort((a, b) => players[b].score - players[a].score || (players[a].at || 0) - (players[b].at || 0));
  ids.sort((a, b) => (players[a].at || 0) - (players[b].at || 0)).forEach((id, idx) => {
    const p = players[id];
    let el = laneEls[id];
    if (!el) {
      const lane = document.createElement("div"); lane.className = "lane";
      lane.innerHTML = '<div class="duck"><span class="tag"></span><span class="em">🦆</span></div>';
      $("lanes").appendChild(lane);
      el = laneEls[id] = lane.firstChild;
      el.querySelector(".em").style.filter = `hue-rotate(${(idx * 47) % 360}deg)`;
    }
    el.classList.toggle("me", id === myId);
    const lead = id === order[0] && p.score > 0 ? "👑 " : "";
    el.querySelector(".tag").textContent = `${lead}${p.name}${p.shield ? " 🛡️" : ""} · ${p.score}`;
    el.style.left = (2 + 76 * (p.score / top)) + "%";   // người dẫn đầu luôn ở xa nhất
  });
  $("rank").innerHTML = order.map((id, i) =>
    `<span class="chip">${["🥇", "🥈", "🥉"][i] || (i + 1) + "."} ${esc(players[id].name)}: ${players[id].score}</span>`).join("");
  const mine = players[myId];
  if (mine) {
    $("score").textContent = `Điểm: ${mine.score}`;
    $("mystatus").textContent = [boost ? "⚡ Câu tới được nhân đôi điểm" : "", mine.shield ? "🛡️ Đang có khiên" : ""].filter(Boolean).join("   ");
    if (mine.hit && mine.hit.t > seenHit) {
      seenHit = mine.hit.t;
      if (mine.hit.t > Date.now() - 15000) toast(`🏴‍☠️ ${mine.hit.by} vừa cướp ${mine.hit.n} điểm của bạn!`);
    }
  }
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.remove("hide"); setTimeout(() => el.classList.add("hide"), 3500); }

/* ---------- Trò chơi ---------- */
let qi = 0, t0 = 0, tick = null, locked = false;
const show = id => ["s-join", "s-play", "s-end"].forEach(s => $(s).classList.toggle("hide", s !== id));

function showQ() {
  if (qi >= QUESTIONS.length) { $("final").textContent = `Điểm của bạn: ${players[myId]?.score ?? 0}`; show("s-end"); return; }
  const Q = QUESTIONS[qi]; locked = false;
  $("prog").textContent = `Câu ${qi + 1}/${QUESTIONS.length}`;
  $("qtext").textContent = Q.q; $("fb").textContent = "";
  $("power").classList.add("hide"); $("opts").innerHTML = "";
  Q.a.forEach((t, i) => {
    const b = document.createElement("button"); b.className = "opt";
    b.textContent = String.fromCharCode(65 + i) + ". " + t;
    b.onclick = () => answer(i); $("opts").appendChild(b);
  });
  t0 = Date.now(); clearInterval(tick);
  tick = setInterval(() => {
    const left = Math.max(0, PER_Q - (Date.now() - t0) / 1000);
    $("timer").style.transform = `scaleX(${left / PER_Q})`;
    if (left <= 0) answer(-1);
  }, 100);
  render();
}
const next = () => { qi++; showQ(); };

async function answer(i) {
  if (locked) return; locked = true; clearInterval(tick);
  const Q = QUESTIONS[qi], sec = (Date.now() - t0) / 1000, ok = i === Q.c;
  let gain = ok ? 100 + Math.round(50 * Math.max(0, 1 - sec / PER_Q)) : 0;
  const doubled = boost && ok; if (doubled) gain *= 2;
  boost = false;   // vật phẩm nhân đôi chỉ có hiệu lực 1 câu
  [...$("opts").children].forEach((b, k) => { b.disabled = true; if (k === Q.c) b.classList.add("ok"); else if (k === i) b.classList.add("bad"); });
  $("fb").textContent = ok ? `Chính xác! +${gain}${doubled ? " (đã nhân đôi ⚡)" : ""}` : (i < 0 ? "Hết giờ!" : "Chưa đúng rồi.");
  $("fb").style.color = ok ? "var(--ok)" : "var(--bad)";
  if (gain) await update(myId, p => { p.score += gain; });
  if (ok && Math.random() < POWERUP_CHANCE) return givePower();
  setTimeout(next, 1300);
}

/* ---------- Vật phẩm ngẫu nhiên ---------- */
function givePower() {
  const box = $("power"); box.classList.remove("hide");
  const targets = Object.keys(players).filter(id => id !== myId);
  const kinds = ["x2", "shield"]; if (targets.length) kinds.push("steal");
  const k = kinds[Math.floor(Math.random() * kinds.length)];
  if (k === "x2") {
    boost = true; box.innerHTML = "🎁 Bạn nhận được <b>⚡ Nhân đôi điểm</b>: câu kế tiếp sẽ được x2!"; render();
    setTimeout(next, 2200);
  } else if (k === "shield") {
    update(myId, p => { p.shield = true; });
    box.innerHTML = "🎁 Bạn nhận được <b>🛡️ Khiên</b>: chặn được 1 lần bị cướp điểm!";
    setTimeout(next, 2200);
  } else {
    box.innerHTML = `🎁 Bạn nhận được <b>🏴‍☠️ Cướp ${Math.round(STEAL_PERCENT * 100)}% điểm</b>. Chọn nạn nhân:<br>`;
    targets.sort((a, b) => players[b].score - players[a].score).forEach(id => {
      const b = document.createElement("button");
      b.textContent = `${players[id].name} (${players[id].score})`;
      b.onclick = () => steal(id); box.appendChild(b);
    });
    const s = document.createElement("button"); s.className = "skip"; s.textContent = "Bỏ qua"; s.onclick = next; box.appendChild(s);
  }
}

async function steal(id) {
  const box = $("power"); box.innerHTML = "Đang cướp...";
  let taken = 0, blocked = false;
  await update(id, p => {
    taken = 0; blocked = false;
    if (p.shield) { p.shield = false; blocked = true; return; }
    taken = Math.floor((p.score || 0) * STEAL_PERCENT);
    p.score -= taken;
    p.hit = { by: myName, n: taken, t: Date.now() };
  });
  if (taken) await update(myId, p => { p.score += taken; });
  box.innerHTML = blocked ? `🛡️ ${esc(players[id]?.name || "Đối thủ")} có khiên, cú cướp bị chặn!` : `🏴‍☠️ Bạn cướp được <b>${taken}</b> điểm!`;
  setTimeout(next, 2200);
}

$("go").onclick = async () => {
  myName = $("name").value.trim();
  if (!myName) return $("name").focus();
  $("go").disabled = true;
  await join(); qi = 0; show("s-play"); showQ();
};
$("name").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
if (DEMO) render();
</script>
</body>
</html>
